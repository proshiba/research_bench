<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>research_bench</title>
<meta name="description" content="セキュリティ調査アプリを横断するポータル" />
<!-- 配信時に CI がコミット SHA を差し込む。ローカルでは dev のまま -->
<meta name="rb-build" content="dev" />
<link rel="stylesheet" href="assets/style.css" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='7' cy='7' r='4.5' fill='none' stroke='%238fa9c9' stroke-width='1.6'/%3E%3Cpath d='M10.4 10.4 14 14' stroke='%238fa9c9' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E" />
</head>
<body>

<div class="shell">

  <nav class="rail" aria-label="グローバルメニュー">
    <a class="rail-mark" href="#/dashboard" title="research_bench">rb</a>

    <button class="rail-btn" type="button" data-route="dashboard" title="ダッシュボード" aria-label="ダッシュボード">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="3" width="7.5" height="7.5" /><rect x="13.5" y="3" width="7.5" height="4.5" />
        <rect x="13.5" y="10.5" width="7.5" height="10.5" /><rect x="3" y="13.5" width="7.5" height="7.5" />
      </svg>
    </button>

    <button class="rail-btn" type="button" data-route="search" title="クロスサーチ" aria-label="クロスサーチ">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
        <circle cx="10.5" cy="10.5" r="6.5" /><path d="M15.4 15.4 21 21" />
        <path d="M4 10.5h13" stroke-dasharray="2 2.4" />
      </svg>
    </button>

    <button class="rail-btn" type="button" data-route="workbench" title="ワークベンチ" aria-label="ワークベンチ">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
        <circle cx="5.5" cy="6" r="2.6" /><circle cx="18" cy="5" r="2.4" />
        <circle cx="12.5" cy="13.5" r="3" /><circle cx="5" cy="19" r="2.4" />
        <path d="M7.7 7.4 10.4 11.6M15.9 6.4l-1.6 4.5M10.5 15.8 6.7 17.9" />
      </svg>
    </button>

    <div class="rail-spacer"></div>

    <button class="rail-btn" type="button" id="osintBtn" title="OSINT 設定" aria-label="OSINT 設定">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="8" cy="12" r="3.6" />
        <path d="M11.6 12H21M17.4 12v3.4M20 12v2.4" />
      </svg>
    </button>

    <button class="rail-btn" type="button" id="themeBtn" title="表示テーマ" aria-label="表示テーマを切り替え">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4.2" />
        <path d="M12 2.6v2.2M12 19.2v2.2M21.4 12h-2.2M4.8 12H2.6M18.6 5.4l-1.6 1.6M7 17l-1.6 1.6M18.6 18.6 17 17M7 7 5.4 5.4" />
      </svg>
    </button>

    <button class="rail-btn" type="button" id="repoBtn" title="リポジトリ" aria-label="リポジトリ" aria-haspopup="true" aria-expanded="false">
      <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.6 7.6 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z" />
      </svg>
    </button>
  </nav>

  <div class="main">

    <header class="topbar">
      <div class="ctx" id="ctx">
        <button class="ctx-btn" type="button" id="ctxBtn" aria-haspopup="true" aria-expanded="false">
          <span class="ctx-dot" id="ctxDot"></span>
          <span class="ctx-name" id="ctxName">読み込み中</span>
          <span class="ctx-slug" id="ctxSlug"></span>
          <span class="ctx-caret" id="ctxCaret" aria-hidden="true">
            <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
              <path d="m2.5 4.5 3.5 3.5 3.5-3.5" />
            </svg>
          </span>
        </button>
        <div class="ctx-menu" id="ctxMenu" role="menu" hidden></div>
      </div>

      <form class="search" id="searchForm" role="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <circle cx="10.5" cy="10.5" r="6.5" /><path d="M15.4 15.4 21 21" />
        </svg>
        <input id="q" type="search" spellcheck="false" autocomplete="off"
               placeholder="IP / ドメイン / ハッシュ / CVE / アクター名 を全ソース横断で検索"
               aria-label="クロスサーチ" />
        <kbd>Enter</kbd>
      </form>

      <a class="topbar-link" id="openExternal" href="#" target="_blank" rel="noopener" hidden>
        別タブで開く
        <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" aria-hidden="true">
          <path d="M4.5 2H2v8h8V7.5M7 2h3v3M10 2 5.5 6.5" />
        </svg>
      </a>
    </header>

    <div class="stage" id="stage">
      <section class="view" data-route="dashboard" aria-label="ダッシュボード"></section>
      <section class="view" data-route="search" aria-label="クロスサーチ"></section>
      <section class="view" data-route="workbench" aria-label="ワークベンチ"></section>
    </div>
  </div>

  <footer class="statusbar" id="statusbar"></footer>
</div>

<div class="popover" id="repoMenu" hidden role="menu"></div>

<dialog class="modal" id="osintDialog" aria-labelledby="osintTitle"></dialog>

<noscript>
  <p style="padding:2rem">このポータルは JavaScript が必要です。</p>
</noscript>

<script type="module" src="assets/js/main.js"></script>
</body>
</html>
